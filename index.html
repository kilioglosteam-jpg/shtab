<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Штаб CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Russo+One&display=swap">
<style>
/* Layout: sticky tab bar over one working column; cards in auto-fill grids; detail and forms in a sheet overlay. */
:root{
  --bg:#eceef1; --surface:#f9fafb; --surface-2:#e1e5ea; --ink:#15191e; --muted:#5a6470; --line:#cdd3da;
  --accent:#b8700f; --accent-ink:#ffffff; --on-strong:#ffffff; --t:#b06a0c; --ct:#2c6bc0;
  --good:#2b8049; --warn:#a86d12; --bad:#bb3a2c; --shadow:0 12px 40px rgba(20,28,40,.18);
  --f-display:"Russo One","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101318; --surface:#181c22; --surface-2:#222831; --ink:#e6e9ed; --muted:#97a1ad; --line:#2d343e;
  --accent:#e8a13a; --accent-ink:#1a1206; --on-strong:#0d1014; --t:#e8a13a; --ct:#5d9ef2;
  --good:#4fbb75; --warn:#e2a843; --bad:#ec6c5e; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181c22; --surface-2:#222831; --ink:#e6e9ed; --muted:#97a1ad; --line:#2d343e;
  --accent:#e8a13a; --accent-ink:#1a1206; --on-strong:#0d1014; --t:#e8a13a; --ct:#5d9ef2;
  --good:#4fbb75; --warn:#e2a843; --bad:#ec6c5e; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--ct)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:12px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:99px;padding:0 7px;color:var(--muted)}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;margin-right:auto;text-wrap:balance}
.banner{background:var(--surface-2);border-left:3px solid var(--warn);padding:10px 14px;border-radius:4px;color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.month{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:8px 0 -8px}
.list{display:flex;flex-direction:column;gap:10px}
.tcard{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.tcard:hover{border-color:var(--muted)}
.dblock{font-family:var(--f-mono);text-align:center;border-right:1px solid var(--line);padding-right:14px;font-variant-numeric:tabular-nums}
.dblock b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.dblock small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tname{font-weight:700;font-size:17px;margin:0 0 2px}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.s-plan{box-shadow:inset 0 0 0 1px var(--line);background:none}
.chip.s-reg{background:color-mix(in srgb,var(--ct) 18%,transparent);color:var(--ct)}
.chip.s-live{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.chip.s-done{color:var(--muted)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.form{background:none;box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.side{font-family:var(--f-mono);font-weight:600;font-size:12px;padding:2px 8px;border-radius:4px;color:#fff}
.side.T{background:var(--t)} .side.CT{background:var(--ct)}
:root[data-theme="dark"] .side.T{color:#1a1206}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .side.T{color:#1a1206} }
.tright{text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tright b{display:block;font-size:18px;color:var(--ink)}
.calnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:-8px}
.calnav h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;min-width:170px;text-align:center}
.calwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.cal-dow div{padding:6px 8px}
.cal-dow div:nth-child(n+6){color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:3px;border-top:1px solid var(--line);min-height:104px}
.week:first-child{border-top:0}
.day{position:relative;border-left:1px solid var(--line);padding:5px 7px;min-width:0}
.day.c0{border-left:0}
.day.out{background:var(--bg)}
.day.out .dn{opacity:.45}
.day.click{cursor:pointer}
.day.click:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.dn{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;display:inline-block;padding:1px 6px;border-radius:99px}
.day.today .dn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tbar{position:relative;z-index:1;margin:0 4px;border:0;border-radius:4px;font-size:12px;font-weight:600;padding:0 7px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:22px;min-width:0}
.tbar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.tbar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.tbar.s-plan,.sw.s-plan{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--muted);color:var(--ink)}
.tbar.s-reg,.sw.s-reg{background:var(--ct);color:var(--on-strong)}
.tbar.s-live,.sw.s-live{background:var(--good);color:var(--on-strong)}
.tbar.s-done,.sw.s-done{background:var(--surface-2);color:var(--muted)}
.evs{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;padding:0 4px 5px;min-width:0}
.ev{border:0;font-size:11px;font-weight:600;text-align:left;padding:1px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0}
.ev.reg,.sw.ev-reg{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.ev.match,.sw.ev-match{color:var(--ct);background:color-mix(in srgb,var(--ct) 14%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:-8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px}
.sw.ev-reg{background:var(--warn)} .sw.ev-match{background:var(--ct)}
.modal.wide{max-width:1060px}
.sub{display:contents}
.stage{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding:4px 0 2px;border-bottom:2px solid currentColor}
.stage.wide{grid-column:1/-1;margin-top:6px}
.s1{color:var(--accent)} .s2{color:var(--ct)} .s3{color:var(--good)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.br-list{display:flex;flex-direction:column;gap:12px;counter-reset:br;margin-bottom:8px}
.br-ed{counter-increment:br;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.br-head{display:flex;justify-content:space-between;align-items:center}
.br-num::after{content:" " counter(br)}
.br-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
.br-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.br-ed .field input,.br-ed .field textarea{background:var(--surface)}
.zones{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zone{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.zone[aria-pressed="true"]{background:var(--ct);border-color:var(--ct);color:var(--on-strong)}
.zone.static{cursor:default;color:var(--ink);background:color-mix(in srgb,var(--ct) 14%,transparent);border-color:transparent;font-size:12px;padding:2px 7px}
.zone.static.on{background:var(--ct);color:var(--on-strong)}
.zfilter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.hitline{color:var(--good)!important;font-weight:600}
.tree{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr);gap:10px 22px;align-items:stretch}
.th{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;border-bottom:2px solid currentColor;padding-bottom:4px}
.node{position:relative;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px;min-width:0}
.node.def{border-top:3px solid var(--accent);align-self:start;position:sticky;top:0}
.node.cond{border-left:3px solid var(--ct)}
.node.fin{border-left:3px solid var(--good)}
.node.cond::before,.node.fin::before{content:"";position:absolute;left:-23px;top:22px;width:20px;border-top:2px solid var(--line)}
.node.hit{box-shadow:0 0 0 2px var(--good)}
.node.dim{opacity:.45}
.nh{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.until{font-size:12px;color:var(--accent)}
.small{font-size:13px;margin:0}
.rmini{display:flex;flex-direction:column;gap:4px;font-size:13px}
.rmini div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px}
.rmini b{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.rmini span{overflow-wrap:anywhere}
.rv{position:fixed;inset:0;z-index:20;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);outline:none}
.rv-head{display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.rv-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rv-name{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-time{padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.tl{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.tl-labels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tl-lab{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0;opacity:.55;transition:opacity .25s}
.tl-lab[aria-selected="true"]{opacity:1}
.tl-n{font-family:var(--f-mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-t{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bars{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-block:6px;cursor:pointer;touch-action:none;user-select:none}
.tl-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.tl-fill{height:100%;background:currentColor;transform-origin:left;transform:scaleX(0)}
.tl-knob{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:none;left:calc(16.66% - 8px)}
.rv-track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.rv-track::-webkit-scrollbar{display:none}
.rv-page{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rv-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.rv-in > *, .role-grid > *, .br-pick > *{transition:opacity .4s ease, transform .4s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0) * 45ms)}
.rv-page:not(.on) .rv-in > *, .rv-page:not(.on) .role-grid > *, .rv-page:not(.on) .br-pick > *{opacity:0;transform:translateY(14px)}
.rv-kick{font-family:var(--f-mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.rv-lead{font-size:18px;margin:0;max-width:65ch}
.rv-title{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;text-wrap:balance}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.role-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.role-card b{font-family:var(--f-mono);font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.role-card .prose{font-size:15px}
.rv-block h3{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:600}
.rv-next{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.br-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.br-card{border:1px solid var(--line);border-left:3px solid var(--ct);border-radius:8px;background:var(--bg);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.br-card:hover{border-color:var(--muted);border-left-color:var(--ct)}
.br-card[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ct)}
.br-card-n{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.br-card-go{font-weight:700;color:var(--good)}
.br-switch{flex-wrap:wrap;align-self:flex-start}
.overlay.layer{z-index:25}
.recbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:8px 10px 8px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;max-width:calc(100vw - 32px)}
.recbar .btn{color:var(--ink)}
.recbar .btn.ghost{color:var(--bg);border-color:transparent}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#e5484d;display:inline-block;animation:recp 1.2s ease-in-out infinite}
@keyframes recp{50%{opacity:.35}}
.rec-now{display:inline-flex;gap:6px;align-items:center;color:var(--bad);font-weight:600;font-size:13px}
.rc-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.role-card.rc-empty{border-style:dashed}
.rec-btn{color:var(--bad)}
.player{width:100%;max-height:70vh;background:#000;border-radius:6px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
details.past>summary{cursor:pointer;color:var(--muted);font-weight:600;margin-bottom:10px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.maps{display:flex;flex-wrap:wrap;gap:6px}
.mapbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:600}
.mapbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.search{flex:1 1 200px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.scard:hover{border-color:var(--muted)}
.scard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scard .map{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.scard h3{margin:0;font-size:16px}
.scard p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .foot{margin-top:auto;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--muted)}

.empty{border:1px dashed var(--line);border-radius:8px;padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font-size:16px}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.5);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}

.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}

.logout{margin-left:6px}
html,body{margin:0}
img{max-width:100%}

<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>ШТАБ</b><span>календарь · стратбук · соперники</span><button class="btn ghost sm logout" id="logout" type="button" hidden>Выйти</button></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main id="main">
  <div class="empty"><b>Загружаю данные команды…</b></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const DEFAULT_MAPS = ["Ancient","Anubis","Dust2","Inferno","Mirage","Nuke","Train"];
const DEFAULT_ZONES = {
  Ancient:["Mid","Cave","Donut","A Main","Elbow","B Ramp","B Lane","Temple","A Site","B Site"],
  Anubis:["Mid","Connector","Canal","A Main","B Main","Bridge","Water","Street","A Site","B Site"],
  Dust2:["Long","Pit","Short","Mid","Xbox","Lower Tunnels","Upper Tunnels","B Doors","A Site","B Site"],
  Inferno:["Banana","Car","Second Mid","Apps","Balcony","Arch","Library","Pit","Short","Long","A Site","B Site"],
  Mirage:["Palace","Ramp","Tetris","Top Mid","Connector","Window","Short","Underpass","Apps","A Site","B Site"],
  Nuke:["Outside","Lobby","Ramp","Hut","Squeaky","Heaven","Secret","Mini","A Site","B Site"],
  Train:["Ivy","T Connector","Popdog","Lower","Upper","B Halls","Ladder","A Site","B Site"]};
const TSTATUS = {planned:["Планируем","s-plan"],registered:["Заявились","s-reg"],playing:["Играем","s-live"],done:["Завершён","s-done"]};
const FORM_STAGES = {rebuild:"Обкатка состава",building:"Набираем форму",peak:"Пик формы"};
const ROUND_TYPES = {pistol:"Пистолетка",eco:"Эко",force:"Форс",full:"Фулл-бай"};
const ROLES = [["igl","IGL"],["awp","AWP"],["entry","Энтри"],["lurker","Люркер"],["support","Саппорт"]];
const SSTATUS = {ready:"Отработана",wip:"В работе"};
const OUTCOME = {"":"Ещё не играли",win:"Победа",loss:"Поражение"};

const state = {tab:"calendar", tournaments:[], strats:[], opponents:[], maps:DEFAULT_MAPS.slice(),
  db:null, assets:null, canWrite:true, loaded:{t:false,s:false,o:false}, offline:false,
  sf:{q:"",map:"",side:"",rt:"",st:"",zones:[]}, zones:{}, oq:"", modal:null,
  cal:{y:new Date().getFullYear(), m:new Date().getMonth(), mode:"month"}};

try{ const t = localStorage.getItem("shtab.tab"); if(t) state.tab = t; }catch(e){}
try{ const cm = localStorage.getItem("shtab.calmode"); if(cm==="list"||cm==="month") state.cal.mode = cm; }catch(e){}
if(["calendar","strats","opponents"].includes(location.hash.slice(1))) state.tab = location.hash.slice(1);

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==="class") el.className = v;
    else if(k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? "" : v);
  }
  for(const k of kids.flat(Infinity)){ if(k==null || k===false) continue; el.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return el;
}
const inp = (id,val,type="text",ph="") => { const e=h("input",{id,type,placeholder:ph}); e.value = val ?? ""; return e; };
const ta = (id,val,ph="",rows=3) => { const e=h("textarea",{id,rows,placeholder:ph}); e.value = val ?? ""; return e; };
const sel = (id,val,obj) => { const e=h("select",{id}, Object.entries(obj).map(([v,l])=>h("option",{value:v},l))); e.value = val ?? Object.keys(obj)[0]; return e; };
const field = (label,input,wide) => h("label",{class:"field"+(wide?" wide":"")}, h("span",{class:"lbl"},label), input);
const val = id => { const e=document.getElementById(id); return e ? e.value.trim() : ""; };
const fset = t => h("div",{class:"fset"},t);

const MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const parseD = s => { if(!s) return null; const d = new Date(s.length<=10 ? s+"T00:00:00" : s); return isNaN(d) ? null : d; };
const fmtD = s => { const d=parseD(s); return d ? `${d.getDate()} ${MON[d.getMonth()]}` : ""; };
const fmtDT = s => { const d=parseD(s); if(!d) return ""; const t = s.length>10 ? " "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") : ""; return fmtD(s)+t; };
const monthTitle = d => d.toLocaleDateString("ru-RU",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase()).replace(" г.","");
const daysTo = s => { const d=parseD(s); if(!d) return null; const now=new Date(); now.setHours(0,0,0,0); return Math.round((d-now)/864e5); };
const plural = (n,a,b,c) => { const m=n%10, k=n%100; return m===1&&k!==11 ? a : (m>=2&&m<=4&&(k<10||k>=20) ? b : c); };
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : null;
const ext = (u,text) => safeUrl(u) ? h("a",{href:u,target:"_blank",rel:"noopener"},text||u) : null;

let toastT;
function toast(msg){ document.querySelector(".toast")?.remove(); clearTimeout(toastT); const t=h("div",{class:"toast",role:"status"},msg); document.body.append(t); toastT=setTimeout(()=>t.remove(),3200); }

function dbErr(e){
  const c = e && e.code;
  if(c==="invalid_argument"){ state.canWrite=false; render(); toast("Нет доступа. Войдите заново с паролем команды."); }
  else if(c==="quota_exceeded") toast("Хранилище заполнено. Удалите старые записи и попробуйте снова.");
  else if(c==="resource_exhausted") toast("Слишком много действий подряд. Подождите пару секунд.");
  else toast("Не получилось сохранить. Проверьте соединение и попробуйте ещё раз.");
}
async function put(col,id,data){
  if(!state.db){ toast("Хранилище недоступно в этом просмотре."); return false; }
  try{ await state.db.collection(col).doc(id).set({...data, updatedAt:new Date().toISOString()}); return true; }
  catch(e){ if(e && e.code==="unavailable"){ try{ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await state.db.collection(col).doc(id).set({...data, updatedAt:new Date().toISOString()}); return true; }catch(e2){ dbErr(e2); return false; } } dbErr(e); return false; }
}
async function del(col,id){ if(!state.db) return false; try{ await state.db.collection(col).doc(id).delete(); return true; }catch(e){ dbErr(e); return false; } }
const newId = col => state.db ? state.db.collection(col).doc().id : String(Date.now());

function confirmBtn(label, onConfirm){
  let armed=false, t;
  const b = h("button",{type:"button",class:"btn danger left",onclick:()=>{
    if(!armed){ armed=true; b.classList.add("armed"); b.textContent="Точно удалить?"; t=setTimeout(()=>{armed=false;b.classList.remove("armed");b.textContent=label;},4000); return; }
    clearTimeout(t); onConfirm();
  }}, label);
  return b;
}

/* ---------- modal ---------- */
function closeModal(){ document.querySelectorAll(".overlay,.rv").forEach(x=>x.remove());  document.body.classList.remove("locked"); state.modal=null; }
function openModal(title, body, actions, kind="form", rerender){
  closeModal();
  const ov = h("div",{class:"overlay",onclick:e=>{ if(e.target===ov) closeModal(); }},
    h("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":title},
      h("header",{class:"m-head"}, h("h2",{},title), h("button",{type:"button",class:"icon-btn",onclick:closeModal,"aria-label":"Закрыть"},"×")),
      h("div",{class:"m-body"}, body),
      actions && actions.length ? h("footer",{class:"m-foot"}, actions) : null));
  document.body.append(ov); document.body.classList.add("locked");
  state.modal = {kind, rerender};
  const first = ov.querySelector("input,select,textarea"); if(first && kind==="form") first.focus();
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && state.modal) closeModal(); });
function refreshDetail(){ if(state.modal && (state.modal.kind==="detail"||state.modal.kind==="round") && state.modal.rerender) state.modal.rerender(); }

/* ---------- tabs ---------- */
function renderTabs(){
  const tabs = [["calendar","Календарь",state.tournaments.length],["strats","Стратбук",state.strats.length],["opponents","Соперники",state.opponents.length]];
  document.getElementById("tabs").replaceChildren(...tabs.map(([k,l,n])=>h("button",{class:"tab",role:"tab","aria-selected":String(state.tab===k),onclick:()=>{state.tab=k; try{localStorage.setItem("shtab.tab",k);}catch(e){} render(); window.scrollTo(0,0);}}, l, h("span",{class:"n"},n))));
}

function render(){
  renderTabs();
  const m = document.getElementById("main");
  const kids = [];
  if(state.offline) kids.push(h("div",{class:"banner"},"Общее хранилище недоступно в этом просмотре. Откройте страницу на claude.ai, войдя в аккаунт, чтобы видеть и добавлять данные команды."));
  else if(!state.canWrite) kids.push(h("div",{class:"banner"},"У вас доступ только на просмотр. Чтобы добавлять турниры и страты, попросите владельца выдать доступ «Участник»."));
  if(state.tab==="strats") kids.push(...viewStrats());
  else if(state.tab==="opponents") kids.push(...viewOpponents());
  else kids.push(...viewCalendar());
  const act = document.activeElement, actId = act && m.contains(act) ? act.id : null, pos = actId && act.selectionStart;
  m.replaceChildren(...kids);
  if(actId){ const n=document.getElementById(actId); if(n){ n.focus(); try{ if(pos!=null) n.setSelectionRange(pos,pos); }catch(e){} } }
}
const addBtn = (label,fn) => state.canWrite && !state.offline ? h("button",{class:"btn primary",onclick:fn},"+ "+label) : null;
const loading = () => h("div",{class:"empty"},h("b",{},"Загружаю…"));

/* ---------- calendar ---------- */
function matchRecord(list){ let w=0,l=0; for(const m of list){ if(m.outcome==="win") w++; else if(m.outcome==="loss") l++; } return {w,l}; }
function regChip(t){
  if(!t.regDeadline || t.status!=="planned") return null;
  const n = daysTo(t.regDeadline);
  if(n<0) return h("span",{class:"chip bad"},"Регистрация закрыта");
  if(n===0) return h("span",{class:"chip warn"},"Дедлайн регистрации сегодня");
  if(n<=7) return h("span",{class:"chip warn"},`До дедлайна ${n} ${plural(n,"день","дня","дней")}`);
  return h("span",{class:"chip"},"Регистрация до "+fmtD(t.regDeadline));
}
function tCard(t){
  const d = parseD(t.start), e = parseD(t.end);
  const ms = t.matches||[]; const rec = matchRecord(ms);
  const range = d ? (e && (e-d)>0 ? (d.getMonth()===e.getMonth() ? `${d.getDate()}–${e.getDate()}` : `${d.getDate()}–${e.getDate()}`) : String(d.getDate())) : "—";
  const st = TSTATUS[t.status]||TSTATUS.planned;
  return h("button",{class:"tcard",onclick:()=>openTournament(t.id)},
    h("div",{class:"dblock"}, h("b",{},range), h("small",{}, d ? (e && e.getMonth()!==d.getMonth() ? MON[d.getMonth()]+"–"+MON[e.getMonth()] : MON[d.getMonth()]) : "дата?")),
    h("div",{style:"min-width:0"},
      h("p",{class:"tname"},t.name||"Без названия"),
      h("div",{class:"meta"},[t.mode, t.format, t.prize].filter(Boolean).join(" · ") || "Формат не указан"),
      h("div",{class:"chips"}, h("span",{class:"chip "+st[1]},st[0]), t.formStage ? h("span",{class:"chip form"},FORM_STAGES[t.formStage]) : null, regChip(t), t.status==="done" && t.place ? h("span",{class:"chip"},"Место: "+t.place) : null)),
    h("div",{class:"tright"}, ms.length ? [h("b",{},`${rec.w}–${rec.l}`), `${ms.length} ${plural(ms.length,"соперник","соперника","соперников")}`] : "соперники не добавлены"));
}
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function viewCalendar(){
  const c = state.cal;
  const modeSeg = h("div",{class:"seg",role:"group","aria-label":"Вид календаря"}, [["month","Месяц"],["list","Список"]].map(([v,l])=>h("button",{"aria-pressed":String(c.mode===v),onclick:()=>{c.mode=v; try{localStorage.setItem("shtab.calmode",v);}catch(e){} render();}},l)));
  const out = [h("div",{class:"bar"}, h("h1",{},"Турнирный календарь"), modeSeg, addBtn("Турнир",()=>tournamentForm()))];
  if(!state.loaded.t && !state.offline) return [...out, loading()];
  return c.mode==="list" ? [...out, ...listView()] : [...out, ...monthView()];
}
function monthView(){
  const c = state.cal, y = c.y, m = c.m;

/* ---------- OBS recording ---------- */
const MAX_VIDEO = 50*1024*1024;
const obsState = {ws:null, ready:false, rec:null, pending:null, needPick:false, uploading:false, reqs:{}, dir:null};
const obsCfg = () => { try{ return JSON.parse(localStorage.getItem("shtab.obs")||"{}"); }catch(e){ return {}; } };
const obsSave = c => { try{ localStorage.setItem("shtab.obs", JSON.stringify(c)); }catch(e){} };
async function sha256b64(str){ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function obsConnect(){
  return new Promise((resolve, reject)=>{
    if(obsState.ready) return resolve();
    const c = obsCfg(); let ws;
    try{ ws = new WebSocket(c.url || "ws://127.0.0.1:4455"); }catch(e){ return reject(new Error("address")); }
    const t = setTimeout(()=>{ try{ ws.close(); }catch(e){} reject(new Error("timeout")); }, 5000);
    ws.onmessage = async ev => {
      const m = JSON.parse(ev.data);
      if(m.op===0){
        const d = {rpcVersion:1, eventSubscriptions:64};
        if(m.d.authentication){
          if(!c.password){ clearTimeout(t); ws.close(); return reject(new Error("password")); }
          const secret = await sha256b64(c.password + m.d.authentication.salt);
          d.authentication = await sha256b64(secret + m.d.authentication.challenge);
        }
        ws.send(JSON.stringify({op:1, d}));
      } else if(m.op===2){ clearTimeout(t); obsState.ws = ws; obsState.ready = true; resolve(); }
      else if(m.op===7){
        const r = obsState.reqs[m.d.requestId]; if(!r) return; delete obsState.reqs[m.d.requestId];
        m.d.requestStatus.result ? r.res(m.d.responseData||{}) : r.rej(new Error(m.d.requestStatus.comment || "ошибка OBS"));
      } else if(m.op===5 && m.d.eventType==="RecordStateChanged") onRecState(m.d.eventData||{});
    };
    ws.onclose = e => { clearTimeout(t); const was = obsState.ready; obsState.ready = false; obsState.ws = null; if(!was) reject(new Error(e.code===4009 ? "password" : "closed")); if(obsState.rec){ toast("Связь с OBS пропала. Остановите запись в OBS и загрузите файл вручную."); obsState.pending = obsState.rec; obsState.rec = null; obsState.needPick = true; } renderRecBar(); };
  });
}
function obsReq(type, data){
  return new Promise((res, rej)=>{
    if(!obsState.ws) return rej(new Error("нет связи с OBS"));
    const id = rid32(); obsState.reqs[id] = {res, rej};
    obsState.ws.send(JSON.stringify({op:6, d:{requestType:type, requestId:id, requestData:data||{}}}));
    setTimeout(()=>{ if(obsState.reqs[id]){ delete obsState.reqs[id]; rej(new Error("OBS не ответил")); } }, 8000);
  });
}
const obsErrText = m => m==="password" ? "OBS просит пароль, а он не указан или неверный." : m==="timeout"||m==="closed" ? "Не получилось связаться с OBS. Проверьте, что OBS открыт и сервер WebSocket включён." : m==="address" ? "Неверный адрес OBS." : m;

function idb(){ return new Promise((res, rej)=>{ const r = indexedDB.open("shtab",1); r.onupgradeneeded = ()=>r.result.createObjectStore("kv"); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
async function kvGet(k){ try{ const db = await idb(); return await new Promise(res=>{ const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = ()=>res(q.result); q.onerror = ()=>res(null); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const db = await idb(); await new Promise(res=>{ const t = db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete = res; t.onerror = res; }); }catch(e){} }
async function getDir(){ if(!obsState.dir) obsState.dir = await kvGet("recDir"); return obsState.dir; }
async function pickDir(){
  if(!window.showDirectoryPicker){ toast("Этот браузер не умеет выбирать папку. Откройте сайт в Chrome или Edge на компьютере."); return false; }
  try{ const d = await showDirectoryPicker({id:"obs-rec", mode:"read"}); obsState.dir = d; await kvSet("recDir", d); return true; }catch(e){ return false; }
}

async function obsRecord(stratId, key, label){
  if(obsState.rec || obsState.pending || obsState.uploading){ toast("Сначала закончите текущую запись."); return; }
  try{ await obsConnect(); }catch(e){ obsSettings(obsErrText(e.message)); return; }
  try{ await obsReq("StartRecord"); }catch(e){ toast("OBS не начал запись: "+e.message); return; }
  obsState.rec = {stratId, key, label};
  renderRecBar(); refreshDetail();
}
async function obsStop(){ try{ await obsReq("StopRecord"); }catch(e){ toast("Не удалось остановить запись: "+e.message); } }
async function onRecState(d){
  if(d.outputState!=="OBS_WEBSOCKET_OUTPUT_STOPPED" || !obsState.rec) return;
  obsState.pending = {...obsState.rec, path:d.outputPath||""}; obsState.rec = null;
  renderRecBar(); refreshDetail();
  await uploadRecording(false);
}
async function uploadRecording(gesture){
  const rec = obsState.pending; if(!rec) return;
  const name = String(rec.path).split(/[\\/]/).pop();
  let file = null;
  const dir = await getDir();
  if(dir && name){
    let perm = await dir.queryPermission({mode:"read"});
    if(perm!=="granted" && gesture) perm = await dir.requestPermission({mode:"read"});
    if(perm==="granted"){ for(let i=0;i<5 && !file;i++){ try{ file = await (await dir.getFileHandle(name)).getFile(); }catch(e){ await new Promise(r=>setTimeout(r,600)); } } }
  }
  if(!file){ obsState.needPick = true; renderRecBar(); return; }
  await sendRecording(file);
}
const videoType = f => f.type && f.type.startsWith("video/") ? f.type : /\.webm$/i.test(f.name) ? "video/webm" : /\.mov$/i.test(f.name) ? "video/quicktime" : "video/mp4";
async function sendRecording(file){
  const rec = obsState.pending; if(!rec) return;
  obsState.needPick = false;
  if(file.size > MAX_VIDEO){ toast(`Запись весит ${Math.round(file.size/1048576)} МБ, а бесплатный лимит 50 МБ на файл. Запишите покороче или снизьте битрейт в OBS.`); obsState.pending = null; renderRecBar(); return; }
  obsState.uploading = true; renderRecBar();
  try{
    const r = await assetsApi.upload(file, {type:videoType(file)});
    const s = state.strats.find(x=>x.id===rec.stratId); if(!s) throw new Error("страта удалена");
    const old = (s.videos||{})[rec.key];
    const {id, ...rest} = s;
    const videos = {...(s.videos||{}), [rec.key]:{id:r.id, size:file.size, at:new Date().toISOString()}};
    if(await put("strats", s.id, {...rest, videos})){
      state.strats = upsert(state.strats, {id:s.id, videos});
      if(old && old.id) sb.storage.from("shots").remove([old.id]).catch(()=>{});
      toast("Видео прикреплено: "+rec.label); refreshDetail();
    }
  }catch(e){ toast("Не удалось загрузить видео: "+((e&&e.message)||"ошибка")); }
  obsState.uploading = false; obsState.pending = null; renderRecBar();
}
async function removeVideo(stratId, key){
  const s = state.strats.find(x=>x.id===stratId); if(!s || !(s.videos||{})[key]) return;
  const old = s.videos[key]; const videos = {...s.videos}; delete videos[key];
  const {id, ...rest} = s;
  if(await put("strats", s.id, {...rest, videos})){ state.strats = upsert(state.strats, {id:s.id, videos}); sb.storage.from("shots").remove([old.id]).catch(()=>{}); closeLayer(); refreshDetail(); toast("Видео удалено"); }
}

function renderRecBar(){
  let bar = document.getElementById("recbar");
  if(!bar){ bar = h("div",{id:"recbar",class:"recbar",role:"status"}); document.body.append(bar); }
  const p = obsState.pending;
  if(obsState.rec){
    bar.replaceChildren(h("span",{class:"rec-dot"}), h("span",{},"Запись: "+obsState.rec.label), h("button",{class:"btn sm",onclick:obsStop},"Стоп"));
  } else if(obsState.uploading){
    bar.replaceChildren(h("span",{},"Загружаю видео: "+(p?p.label:"")+"…"));
  } else if(p && obsState.needPick){
    const file = h("input",{type:"file",accept:"video/*",hidden:true,"aria-label":"Файл записи"});
    file.addEventListener("change",()=>{ if(file.files[0]) sendRecording(file.files[0]); });
    const name = String(p.path).split(/[\\/]/).pop();
    bar.replaceChildren(h("span",{},"Запись готова"+(name?": "+name:"")),
      h("button",{class:"btn primary sm",onclick:async()=>{ if(!(await getDir())){ if(!(await pickDir())) return; } uploadRecording(true); }},"Загрузить"),
      file, h("button",{class:"btn sm",onclick:()=>file.click()},"Выбрать файл"),
      h("button",{class:"btn ghost sm",onclick:()=>{ obsState.pending=null; obsState.needPick=false; renderRecBar(); }},"Отмена"));
  } else { bar.replaceChildren(); }
  bar.hidden = !bar.childNodes.length;
}

function layer(title, body, actions){
  closeLayer();
  const ov = h("div",{class:"overlay layer",onclick:e=>{ if(e.target===ov) closeLayer(); }},
    h("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":title},
      h("header",{class:"m-head"}, h("h2",{},title), h("button",{type:"button",class:"icon-btn",onclick:closeLayer,"aria-label":"Закрыть"},"×")),
      h("div",{class:"m-body"}, body),
      actions && actions.length ? h("footer",{class:"m-foot"}, actions) : null));
  document.body.append(ov);
}
function closeLayer(){ document.querySelectorAll(".overlay.layer").forEach(x=>x.remove()); }
function playVideo(stratId, key, label){
  const s = state.strats.find(x=>x.id===stratId); const v = s && (s.videos||{})[key]; if(!v) return;
  const vid = h("video",{controls:true,autoplay:true,playsinline:true,src:blobUrl(v.id),class:"player"});
  vid.addEventListener("error",()=>toast("Браузер не может проиграть это видео. Записывайте в OBS в формате MP4."));
  layer(label, [vid], state.canWrite ? [confirmBtn("Удалить видео",()=>removeVideo(stratId,key))] : []);
}
async function obsSettings(err){
  const c = obsCfg();
  const url = inp("obs-url", c.url||"ws://127.0.0.1:4455", "text");
  const pw = inp("obs-pw", c.password||"", "password", "Пароль из настроек OBS");
  const status = h("p",{class:"small",style:err?"color:var(--bad);font-weight:600":""}, err||"");
  const dirLine = h("p",{class:"small muted"});
  const paintDir = async()=>{ const d = await getDir(); dirLine.textContent = d ? "Папка записей: "+d.name : "Папка записей не выбрана. Без неё после записи нужно будет выбрать файл вручную."; };
  paintDir();
  const test = h("button",{class:"btn",onclick:async()=>{
    obsSave({url:url.value.trim(), password:pw.value});
    if(obsState.ws) try{ obsState.ws.close(); }catch(e){}
    status.style.cssText = ""; status.textContent = "Подключаюсь…";
    try{ await obsConnect(); const st = await obsReq("GetRecordDirectory").catch(()=>({})); status.style.cssText="color:var(--good);font-weight:600"; status.textContent = "OBS подключён"+(st.recordDirectory ? ". Записи сохраняются в "+st.recordDirectory : "")+"."; }
    catch(e){ status.style.cssText="color:var(--bad);font-weight:600"; status.textContent = obsErrText(e.message); }
  }},"Сохранить и проверить");
  layer("Подключение OBS", [
    h("ol",{class:"steps"},
      h("li",{},"В OBS откройте Инструменты → Настройки сервера WebSocket, включите сервер, задайте пароль."),
      h("li",{},"В OBS в Настройки → Вывод → Запись выберите формат MP4 и разрешение 720p или 1080p с невысоким битрейтом: бесплатный лимит 50 МБ на одно видео (примерно 2–3 минуты)."),
      h("li",{},"Ниже укажите пароль и выберите папку, куда OBS сохраняет записи. Тогда видео будет загружаться само.")),
    h("div",{class:"form"}, field("Адрес OBS", url), field("Пароль WebSocket", pw)),
    h("div",{class:"bar"}, h("button",{class:"btn",onclick:async()=>{ if(await pickDir()) paintDir(); }},"Выбрать папку записей"), test),
    dirLine, status,
    h("p",{class:"small muted"},"Работает в Chrome или Edge на том же компьютере, где запущен OBS. Настройки запоминаются в этом браузере.")
  ], [h("button",{class:"btn primary",onclick:()=>{ obsSave({url:url.value.trim(), password:pw.value}); closeLayer(); }},"Готово")]);
}
function roleCard(s, part, r, l, text, it){
  const key = part+":"+r, v = (s.videos||{})[key];
  const recNow = obsState.rec && obsState.rec.stratId===s.id && obsState.rec.key===key;
  const can = state.canWrite && !state.offline;
  if(!text && !v && !can) return null;
  const label = l+" · "+(part==="default" ? "дефолт" : ((s.branches||[]).find(b=>"b:"+b.id===part)?.finish?.name || "доигровка"));
  const acts = [];
  if(v) acts.push(h("button",{class:"btn sm",onclick:()=>playVideo(s.id,key,label)},"▶ Видео"));
  if(can) acts.push(recNow ? h("span",{class:"rec-now"},h("span",{class:"rec-dot"}),"Идёт запись") : h("button",{class:"btn ghost sm rec-btn",onclick:()=>obsRecord(s.id,key,label)}, v ? "Перезаписать" : "● Записать"));
  return it(h("div",{class:"role-card"+(text||v?"":" rc-empty")}, h("b",{},l), text ? prose(text) : h("p",{class:"muted small"},"Не расписано"), acts.length ? h("div",{class:"rc-acts"},acts) : null));
}

const rid32 = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()).replace(/[^a-z0-9]/gi,"").slice(0,32);
function blobUrl(id){ return SB_URL + "/storage/v1/object/public/shots/" + encodeURIComponent(id); }

function makeDb(){
  const listeners = {}, cache = {}, loaded = {};
  const snapOf = col => ({docs:[...(cache[col]||new Map()).entries()].map(([id,data])=>({id, exists:true, data:()=>data}))});
  const emit = col => (listeners[col]||new Set()).forEach(f=>f(snapOf(col)));
  const err = e => ({code: e && (e.code==="42501" || e.status===401 || e.status===403 || /row-level security|JWT/i.test(e.message||"")) ? "invalid_argument" : "unavailable", message: e && e.message});
  sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"}, p=>{
    const row = (p.new && p.new.collection) ? p.new : p.old;
    if(!row || !row.collection || !cache[row.collection]) return;
    if(p.eventType==="DELETE") cache[row.collection].delete(row.id); else cache[row.collection].set(row.id, p.new.data);
    emit(row.collection);
  }).subscribe();
  async function load(col){
    const {data, error} = await sb.from("docs").select("id,data").eq("collection",col).limit(5000);
    if(error) throw error;
    cache[col] = new Map(data.map(r=>[r.id, r.data])); loaded[col] = true; emit(col);
  }
  function collectionRef(col){
    return {
      doc(id){ return docRef(col, id || rid32()); },
      onSnapshot(fn, onErr){
        (listeners[col] ||= new Set()).add(fn);
        if(!(col in cache)){ cache[col] = new Map(); load(col).catch(e=>{ onErr && onErr(err(e)); }); }
        else if(loaded[col]) fn(snapOf(col));
        return () => listeners[col].delete(fn);
      }
    };
  }
  function docRef(col, id){
    return {
      id,
      async set(data){
        const {error} = await sb.from("docs").upsert({collection:col, id, data, updated_at:new Date().toISOString()});
        if(error) throw err(error);
        (cache[col] ||= new Map()).set(id, data); emit(col);
      },
      async delete(){
        const {error} = await sb.from("docs").delete().eq("collection",col).eq("id",id);
        if(error) throw err(error);
        cache[col]?.delete(id); emit(col);
      },
      onSnapshot(fn, onErr){
        return collectionRef(col).onSnapshot(()=>{ const d = cache[col]?.get(id); fn(d ? {exists:true, data:()=>d} : {exists:false, data:()=>undefined}); }, onErr);
      }
    };
  }
  return {collection:collectionRef, doc:path=>{ const [c,i] = path.split("/"); return docRef(c,i); }};
}
const assetsApi = {
  async upload(blob, opts){
    const id = rid32();
    const {error} = await sb.storage.from("shots").upload(id, blob, {contentType:(opts&&opts.type) || blob.type || "image/jpeg", cacheControl:"31536000"});
    if(error) throw {code: /size|large|exceed/i.test(error.message||"") ? "too_large" : /mime|type/i.test(error.message||"") ? "unsupported_type" : "upstream_error", message:error.message};
    return {id, url:blobUrl(id)};
  }
};

function showLogin(msg){
  document.getElementById("tabs").replaceChildren();
  const pw = h("input",{id:"login-pw",type:"password",autocomplete:"current-password",placeholder:"Пароль команды","aria-label":"Пароль команды"});
  const btn = h("button",{class:"btn primary",type:"submit"},"Войти");
  const form = h("form",{class:"login"},
    h("b",{class:"login-t"},"Вход в штаб"),
    h("span",{class:"muted"},"Введите пароль команды. Устройство запомнит его, и в следующий раз вводить не придётся."),
    pw, btn, msg ? h("span",{class:"login-err"},msg) : null);
  form.addEventListener("submit", async e=>{
    e.preventDefault(); if(!pw.value) return;
    btn.disabled = true; btn.textContent = "Проверяю…";
    const {error} = await sb.auth.signInWithPassword({email:TEAM_EMAIL, password:pw.value});
    if(error){ showLogin(/invalid|credentials/i.test(error.message) ? "Неверный пароль. Спросите его у капитана." : "Не получилось войти. Проверьте интернет и попробуйте ещё раз."); return; }
    start();
  });
  document.getElementById("main").replaceChildren(form);
  pw.focus();
}

function maybeOfferImport(){
  if(state.tournaments.length || state.strats.length || state.opponents.length) return;
  const file = h("input",{type:"file",accept:"application/json,.json",hidden:true,"aria-label":"Файл с данными"});
  const btn = h("button",{class:"btn primary",onclick:()=>file.click()},"Выбрать файл");
  const bar = h("div",{class:"banner import"}, h("span",{},"База пока пустая. Если у вас есть файл с данными из старой версии сайта (shtab-export.json), загрузите его сюда."), file, btn);
  file.addEventListener("change", async()=>{
    const f = file.files[0]; if(!f) return;
    btn.disabled = true;
    try{
      const bundle = JSON.parse(await f.text());
      const shots = bundle.shots || {};
      let i = 0; const ids = Object.keys(shots);
      for(const id of ids){
        btn.textContent = `Скрины ${++i}/${ids.length}…`;
        const blob = await (await fetch(shots[id])).blob();
        const {error} = await sb.storage.from("shots").upload(id, blob, {contentType: blob.type || "image/png", upsert:true});
        if(error) throw error;
      }
      btn.textContent = "Записи…";
      const rows = [];
      for(const [col, docs] of Object.entries(bundle.collections||{})) for(const [id, data] of Object.entries(docs)) rows.push({collection:col, id, data, updated_at:new Date().toISOString()});
      const {error} = await sb.from("docs").upsert(rows);
      if(error) throw error;
      toast("Данные перенесены"); setTimeout(()=>location.reload(), 800);
    }catch(e){ btn.disabled=false; btn.textContent="Выбрать файл"; file.value=""; toast("Перенос не удался: "+((e&&e.message)||"ошибка")); }
  });
  document.getElementById("main").prepend(bar);
}

document.getElementById("logout").addEventListener("click", async()=>{ await sb.auth.signOut(); location.reload(); });
let started = false;
function start(){
  if(started) return; started = true;
  document.getElementById("logout").hidden = false;
  const db = makeDb();
  state.db = db; state.assets = assetsApi; state.canWrite = true; state.offline = false;
  render();
  let pending = 3;
  const sub = (col,key) => db.collection(col).onSnapshot(snap=>{
    state[col] = snap.docs.map(d=>({id:d.id,...d.data()}));
    const first = !state.loaded[key]; state.loaded[key]=true; render(); refreshDetail();
    if(first && --pending===0) maybeOfferImport();
  }, e=>{ state.loaded[key]=true; render(); if(e.code==="invalid_argument"){ sb.auth.signOut(); started=false; showLogin("Сессия устарела, войдите заново."); } });
  sub("tournaments","t"); sub("strats","s"); sub("opponents","o");
  db.doc("settings/maps").onSnapshot(s=>{ const dt = s.exists ? s.data() : null; if(!dt) return; if(Array.isArray(dt.maps) && dt.maps.length) state.maps=dt.maps.slice(); if(dt.zones && typeof dt.zones==="object") state.zones=dt.zones; if(state.tab==="strats" && !state.modal) render(); }, ()=>{});
}

  if(data && data.session) start(); else showLogin();
