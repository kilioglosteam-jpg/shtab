name: Telegram — обновления платформы
on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 20
      - name: Последнее изменение сайта (ручной запуск)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git log -1 --format=%B -- index.html | jq -Rs '{commits:[{message:.}]}' > "$RUNNER_TEMP/event.json"
          echo "EVENT_FILE=$RUNNER_TEMP/event.json" >> "$GITHUB_ENV"
      - name: Сообщение в тему «Обновления»
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
          TOPIC: ${{ secrets.TG_TOPIC_UPDATES }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "Секреты Telegram не заданы, пропускаю"; exit 0; fi
          TEXT=$(jq -r '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            [.commits[] | select(.message | test("\\[skip tg\\]") | not) | .message | split("\n")[0] | esc | "• " + .]
            | if length == 0 then "" else
                "🆕 <b>Обновление платформы</b>\n" + join("\n")
                + "\n<a href=\"https://kilioglosteam-jpg.github.io/shtab/\">Открыть сайт</a>" end
          ' "${EVENT_FILE:-$GITHUB_EVENT_PATH}")
          [ -z "$TEXT" ] && { echo "Нечего отправлять"; exit 0; }
          BODY=$(jq -n --arg c "$CHAT" --arg t "$TEXT" --arg th "$TOPIC" \
            '{chat_id:$c, text:$t, parse_mode:"HTML", disable_web_page_preview:true}
             + (if $th == "" then {} else {message_thread_id:($th|tonumber)} end)')
          curl -fsS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -H "Content-Type: application/json" -d "$BODY" > /dev/null
